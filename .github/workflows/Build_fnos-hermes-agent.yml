name: Build fnOS Hermes Agent FPK

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（格式：0.18.0，留空则使用 manifest 中的版本）'
        required: false
        default: ''

permissions:
  contents: write

env:
  APP_NAME: "hermes-agent"
  MANIFEST_FILE: "manifest"

jobs:
  build-fpk:
    runs-on: ubuntu-latest
    outputs:
      fpk_full: ${{ steps.build_full.outputs.fpk_full }}
      fpk_light: ${{ steps.build_light.outputs.fpk_light }}
      version: ${{ steps.version.outputs.version }}

    steps:
      # 1. 检出代码
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. 设置时区
      - name: Set timezone
        run: sudo timedatectl set-timezone "Asia/Shanghai"

      # 3. 读取 manifest 版本信息
      - name: Get version from manifest
        id: version
        run: |
          VERSION=$(grep "^version" ${{ env.MANIFEST_FILE }} | awk -F'=' '{print $2}' | tr -d ' ')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "从 manifest 读取的版本号：v$VERSION"

      # 4. 确定最终版本号
      - name: Determine target version
        id: target_version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            TARGET_VERSION="${{ github.event.inputs.version }}"
            echo "使用输入的版本号：v$TARGET_VERSION"
          else
            TARGET_VERSION="${{ steps.version.outputs.version }}"
            echo "使用 manifest 版本号：v$TARGET_VERSION"
          fi
          echo "target_version=$TARGET_VERSION" >> $GITHUB_OUTPUT

      # 5. 安装 fnpack 工具
      - name: Install fnpack
        run: |
          FNPACK_URL="https://static2.fnnas.com/fnpack/fnpack-1.0.4-linux-amd64"
          curl -fsSL "$FNPACK_URL" -o fnpack
          chmod +x fnpack
          mv fnpack /usr/local/bin/
          which fnpack
          echo "fnpack 已安装并可用"

      # 6. 更新 manifest 版本号
      - name: Update manifest version
        run: |
          VERSION="${{ steps.target_version.outputs.target_version }}"
          sed -i "s/^version.*=/version       = $VERSION/" ${{ env.MANIFEST_FILE }} || exit 1
          echo "Updated manifest:"
          grep "^version" ${{ env.MANIFEST_FILE }}

      # 7. 创建输出目录
      - name: Create dist directory
        run: mkdir -p dist

      # 8. 打包应用（常规版）
      - name: Build FPK (Full)
        id: build_full
        run: |
          FNPACK="fnpack"
          APP_DIR="$GITHUB_WORKSPACE"
          VERSION="${{ steps.target_version.outputs.target_version }}"
          
          echo "开始打包：${{ env.APP_NAME }} (完整版)"
          echo "目标版本：v$VERSION"
          
          cd "$APP_DIR"
          
          if ! "$FNPACK" build --directory "$APP_DIR"; then
            echo "::error:: fnpack 打包失败"
            exit 1
          fi
          
          SOURCE_FPK="${{ env.APP_NAME }}.fpk"
          DIST_DIR="dist"
          TARGET_NAME="fnos-${{ env.APP_NAME }}_v${VERSION}.fpk"
          
          if [ -f "$SOURCE_FPK" ]; then
            mv "$SOURCE_FPK" "$DIST_DIR/$TARGET_NAME"
            SIZE=$(du -h "$DIST_DIR/$TARGET_NAME" | cut -f1)
            echo "打包成功：$TARGET_NAME ($SIZE)"
            echo "fpk_full=$TARGET_NAME" >> $GITHUB_OUTPUT
            echo "size_full=$SIZE" >> $GITHUB_OUTPUT
          else
            echo "::error:: fnpack 未生成 FPK 文件"
            exit 1
          fi

      # 9. 打包轻量版（剔除 trim-cli）
      - name: Build FPK (Lightweight, No TrimCLI)
        id: build_light
        run: |
          FNPACK="fnpack"
          APP_DIR="$GITHUB_WORKSPACE"
          VERSION="${{ steps.target_version.outputs.target_version }}"
          LIGHTWORK_DIR="$GITHUB_WORKSPACE-light"
          
          echo "开始打包：${{ env.APP_NAME }} (轻量版，无 trim-cli)"
          echo "目标版本：v$VERSION"
          
          # 复制全部文件到临时目录（含隐藏文件），并移除输出目录避免把完整版 FPK 打进轻量包
          rm -rf "$LIGHTWORK_DIR"
          mkdir -p "$LIGHTWORK_DIR"
          cp -a "$APP_DIR"/. "$LIGHTWORK_DIR/"
          rm -rf "$LIGHTWORK_DIR/dist"
          
          # 递归删除 trim-cli 目录（如果存在）
          if [ -d "$LIGHTWORK_DIR/config/prompts/skills/trim-cli" ]; then
            rm -rf "$LIGHTWORK_DIR/config/prompts/skills/trim-cli"
            echo "已删除 config/prompts/skills/trim-cli"
          fi
          
          cd "$LIGHTWORK_DIR"
          
          if ! "$FNPACK" build --directory "$LIGHTWORK_DIR"; then
            echo "::error:: fnpack 轻量版打包失败"
            exit 1
          fi
          
          SOURCE_FPK="${{ env.APP_NAME }}.fpk"
          DIST_DIR="$APP_DIR/dist"
          TARGET_NAME="fnos-${{ env.APP_NAME }}_v${VERSION}_无trimcli.fpk"
          
          if [ -f "$SOURCE_FPK" ]; then
            mv "$SOURCE_FPK" "$DIST_DIR/$TARGET_NAME"
            SIZE=$(du -h "$DIST_DIR/$TARGET_NAME" | cut -f1)
            echo "打包成功：$TARGET_NAME ($SIZE)"
            echo "fpk_light=$TARGET_NAME" >> $GITHUB_OUTPUT
            echo "size_light=$SIZE" >> $GITHUB_OUTPUT
            
            # 清理临时工作目录
            rm -rf "$LIGHTWORK_DIR"
          else
            echo "::error:: fnpack 未生成轻量版 FPK 文件"
            exit 1
          fi

      # 10. 准备 Release 说明
      - name: Generate release notes
        id: release_notes
        run: |
          VERSION="${{ steps.target_version.outputs.target_version }}"
          FPK_NAME="fnos-${{ env.APP_NAME }}_v${VERSION}.fpk"
          
          printf '*%s*\n\n' "$VERSION" > release_body.md
          printf '\n*Commit: %s*\n' "${{ github.sha }}" >> release_body.md

          echo "Release notes 已生成"

      # 11. 创建 Draft Release
      - name: Create Draft Release
        id: create_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.target_version.outputs.target_version }}"
          RELEASE_TAG="v${VERSION}"
          DIST_DIR="dist"
          
          echo "创建 Draft Release: $RELEASE_TAG"
          echo "待上传文件："
          ls -1 "$DIST_DIR"/*.fpk
          
          gh release create "$RELEASE_TAG" \
            "$DIST_DIR"/*.fpk \
            --draft \
            --title "$VERSION" \
            --notes-file release_body.md || exit 1
          
          echo "Draft Release 已创建"
          echo "release_url=https://github.com/${{ github.repository }}/releases/tag/$RELEASE_TAG" >> $GITHUB_OUTPUT

      # 12. 构建摘要
      - name: Build Summary
        run: |
          echo "### ✅ 构建完成" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| 项目 | 版本 | FPK 文件名 | 大小 |" >> $GITHUB_STEP_SUMMARY
          echo "|------|------|-----------|------|" >> $GITHUB_STEP_SUMMARY
          echo "| fnOS Hermes Agent（完整版） | v${{ steps.target_version.outputs.target_version }} | ${{ steps.build_full.outputs.fpk_full }} | ${{ steps.build_full.outputs.size_full }} |" >> $GITHUB_STEP_SUMMARY
          echo "| fnOS Hermes Agent（无 trimcli） | v${{ steps.target_version.outputs.target_version }} | ${{ steps.build_light.outputs.fpk_light }} | ${{ steps.build_light.outputs.size_light }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**[Draft Release](https://github.com/${{ github.repository }}/releases)** — 请确认后发布" >> $GITHUB_STEP_SUMMARY
